all:
  children:
    main_cluster:
      hosts:
        localhost:
          ansible_connection: "{{ connection_env }}"
    edge:
      hosts:
        edge-server:
          ansible_host: "{{ edge_server_name }}"
          ansible_user: "{{ ansible_user }}"
          ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file }}"