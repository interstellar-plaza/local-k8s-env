---
- name: Deploy to Main K8s Cluster
  hosts: main_cluster
  gather_facts: false
  roles:
    - traefik
    - keycloak
    - podinfo

- name: Deploy to Edge Server
  hosts: edge
  gather_facts: false
  module_defaults:
    kubernetes.core.k8s:
      validate_certs: false
      kubeconfig: /var/snap/microk8s/current/credentials/client.config
  roles:
    - podinfo_edge