- name: Create podinfo namespace on Edge
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ env }}"
    state: present

- name: Deploy Podinfo on edge (MicroK8s)
  kubernetes.core.k8s:
    state: present
    kubeconfig: /var/snap/microk8s/current/credentials/client.config
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: podinfo-edge
        namespace: "{{ env }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: podinfo-edge
        template:
          metadata:
            labels:
              app: podinfo-edge
          spec:
            containers:
              - name: podinfo
                image: "stefanprodan/podinfo:{{ components.podinfo }}"
                ports:
                  - containerPort: 9898

- name: Expose Podinfo on edge via NodePort
  kubernetes.core.k8s:
    state: present
    kubeconfig: /var/snap/microk8s/current/credentials/client.config
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: podinfo-edge
        namespace: "{{ env }}"
      spec:
        type: NodePort
        selector:
          app: podinfo-edge
        ports:
          - port: 9898
            targetPort: 9898
            nodePort: 30099