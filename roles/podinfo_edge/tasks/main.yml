- name: Create podinfo namespace on Edge
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ env }}"
    state: present

- name: Deploy Podinfo on edge (MicroK8s)
  kubernetes.core.k8s:
    state: present
    kubeconfig: /var/snap/microk8s/current/credentials/client.config
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: podinfo-edge
        namespace: "{{ env }}"
      spec:
        revisionHistoryLimit: 3 # Default to 10, 3 is for local testing only
        replicas: 1
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
        selector:
          matchLabels:
            app: podinfo-edge
        template:
          metadata:
            labels:
              app: podinfo-edge
          spec:
            containers:
              - name: podinfo
                image: "stefanprodan/podinfo:{{ components.podinfo }}"
                ports:
                  - containerPort: 9898
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 9898
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  failureThreshold: 3
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 9898
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 3

- name: Wait for Podinfo edge rollout — auto-rollback on failure
  block:
    - name: Wait for Podinfo edge rollout to complete
      ansible.builtin.command: >
        microk8s kubectl rollout status deployment/podinfo-edge
        --namespace={{ env }}
        --timeout=120s
      changed_when: false
  rescue:
    - name: Check rollout history
      ansible.builtin.command: >
        microk8s kubectl get replicasets
        --namespace={{ env }}
        --selector=app=podinfo-edge
        --no-headers
      register: replicasets
      changed_when: false

    - name: Rollout failed — rolling back Podinfo edge to previous version
      ansible.builtin.command: >
        microk8s kubectl rollout undo deployment/podinfo-edge
        --namespace={{ env }}
      when: replicasets.stdout_lines | length > 1
      changed_when: true

    - name: Fail the play after rollback
      ansible.builtin.fail:
        msg: "{{ 'Podinfo rollout failed. Automatic rollback triggered.' if replicasets.stdout_lines | length > 1 else 'Podinfo rollout failed on first deploy. No previous version to roll back to — manual intervention required.' }}"

- name: Expose Podinfo on edge via NodePort
  kubernetes.core.k8s:
    state: present
    kubeconfig: /var/snap/microk8s/current/credentials/client.config
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: podinfo-edge
        namespace: "{{ env }}"
      spec:
        type: NodePort
        selector:
          app: podinfo-edge
        ports:
          - port: 9898
            targetPort: 9898
            nodePort: 30099
