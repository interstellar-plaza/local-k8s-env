- name: Create keycloak namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: keycloak
    state: present

- name: Deploy Keycloak
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: keycloak
        namespace: keycloak
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: keycloak
        template:
          metadata:
            labels:
              app: keycloak
          spec:
            containers:
              - name: keycloak
                image: "keycloak/keycloak:{{ components.keycloak_image }}"
                args: ["start-dev"]
                env:
                  - name: KEYCLOAK_ADMIN
                    value: admin
                  - name: KEYCLOAK_ADMIN_PASSWORD
                    value: admin
                ports:
                  - containerPort: 8080

- name: Deploy Keycloak Service (ClusterIP — not exposed externally)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: keycloak
        namespace: keycloak
      spec:
        selector:
          app: keycloak
        ports:
          - port: 8080
            targetPort: 8080

- name: Create Keycloak IngressRoute (via Traefik)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: keycloak
        namespace: keycloak
      spec:
        entryPoints:
          - web
        routes:
          - match: "Host(`keycloak.localhost`)"
            kind: Rule
            services:
              - name: keycloak
                port: 8080